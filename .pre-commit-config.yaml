# Hooks run the project's own gate. Every hook uses `language: system` so nothing
# is downloaded at commit time and the hooks work on a plane.
#
# Cheap checks are wired to commit time. The full gate is wired to push time.
# The split matters: a hook that runs mypy and pytest on every keystroke-batch
# gets bypassed within a week, and a bypassed hook is worse than no hook because
# it creates the belief that something is being checked.

repos:
  - repo: local
    hooks:
      - id: commit-msg
        name: six word subject and sole co-author
        entry: .githooks/check_commit_msg.py
        language: system
        stages: [commit-msg]
        # Filenames are passed through on purpose. For the commit-msg stage the
        # filename git supplies IS the commit message file, and the hook has
        # nothing to read without it. Setting pass_filenames: false here makes
        # the hook fail on a usage error rather than on a bad message, which is
        # fail-closed and still wrong, because it rejects the good messages too.

      - id: ruff-check
        name: ruff lint with autofix
        entry: .venv/bin/ruff check --force-exclude
        language: system
        types_or: [python]
        args: [--fix]

      - id: ruff-format
        name: ruff format
        entry: .venv/bin/ruff format
        language: system
        types_or: [python]

      - id: full-gate
        name: make validate
        entry: make validate
        language: system
        stages: [pre-push]
        always_run: true
        pass_filenames: false
